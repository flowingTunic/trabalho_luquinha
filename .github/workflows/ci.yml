name: Workflow_Auditoria_Tecnica

on: [push, pull_request]

jobs:
  verificacao_completa:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Instalar Requisitos
      run: |
        python -m pip install --upgrade pip
        pip install pytest pylint fastapi httpx pydantic uvicorn
    - name: Rodar Testes Unitarios
      run: python -m pytest
    - name: Rodar Linter Pylint
      run: pylint gerenciador_pedidos/gerenciador_pedidos.py --fail-under=9.0